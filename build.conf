# ============================================================
# pdf-dispatch 构建配置（build_standalone.sh 构建时读取）
# ------------------------------------------------------------
# * 本文件在【构建时】被 source，值会被静态烘焙进绿色包
#   （依赖装进包内 python，模型按此下载，start.sh 按此生成）
# * 改完本文件需要重新构建 + 发版才生效：./scripts/build_standalone.sh
# * KEY=VALUE 格式，等号两侧不要有空格；引号仅依赖列表需要
# ============================================================

# python-build-standalone 发布版本与解释器（决定包内自带的 Python）
PYBS_RELEASE=20240415
PYBS_PYTHON=cpython-3.11.9

# OCR 模型（det/rec 成对下载并烘焙进 start.sh，worker 运行时按此加载）
OCR_DET_MODEL=PP-OCRv6_medium_det
OCR_REC_MODEL=PP-OCRv6_medium_rec

# 依赖列表（空格分隔，装进包内自带 Python 的 site-packages）
WORKER_PIP_DEPS="httpx pymupdf pydantic paddlepaddle paddleocr"
SCHEDULER_PIP_DEPS="httpx pymupdf fastapi pydantic python-multipart uvicorn[standard]"

# ---- 分片规则（烘焙进 scheduler；提交时不传 split_size 则按内容自动选择）----
# 文字页（矢量可提取）PDF：解析快，每片可以大
CHUNK_PAGES_TEXT=10
# 扫描件：OCR 慢（分钟级/页），每片切小让所有 worker 满载
CHUNK_PAGES_SCANNED=1
# 扫描件判定：抽样页中"无可提取文字"的占比 >= 该值 → 按扫描件规则切片
CHUNK_SCANNED_RATIO=0.5
